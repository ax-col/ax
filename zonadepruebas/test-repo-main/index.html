<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Subpáginas AX</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF y AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Encabezado adaptable -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600/20 text-blue-400 mb-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Escáner de Subpáginas</h1>
      <p class="text-xs sm:text-sm text-slate-400">
        Modo actual: <span id="envBadge" class="font-mono text-blue-400 font-bold">Detectando...</span>
      </p>
    </header>

    <!-- Botón de acción -->
    <div class="space-y-3">
      <button id="startBtn" onclick="ejecutarAuditoria()" 
        class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold text-sm sm:text-base py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 touch-manipulation">
        <span>Iniciar Auditoría y Descargar PDF</span>
      </button>
    </div>

    <!-- Panel de Progreso -->
    <div id="statusBox" class="hidden bg-slate-900/90 border border-slate-700/80 rounded-xl p-4 space-y-3 font-mono text-xs">
      <div class="flex justify-between items-center">
        <span id="statusText" class="text-blue-400 truncate pr-2">Conectando con la API de GitHub...</span>
        <span id="scannedCount" class="text-slate-400 shrink-0">0/0</span>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-blue-500 h-2.5 w-0 transition-all duration-300 rounded-full"></div>
      </div>
    </div>

    <!-- Vista previa de resultados -->
    <div id="previewContainer" class="hidden space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Subpáginas Detectadas</h2>
      <div class="overflow-x-auto border border-slate-700/60 rounded-xl bg-slate-900/50 max-h-56">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-800 text-slate-400 sticky top-0">
            <tr>
              <th class="p-2.5">Carpeta</th>
              <th class="p-2.5">Enlace Evaluar</th>
              <th class="p-2.5 text-right">Latencia</th>
            </tr>
          </thead>
          <tbody id="previewBody" class="divide-y divide-slate-800 font-mono">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Detección del entorno al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      const envBadge = document.getElementById('envBadge');
      if (window.location.protocol === 'file:') {
        envBadge.innerText = 'Local (file://)';
      } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        envBadge.innerText = `Local Servidor (${window.location.host})`;
      } else {
        envBadge.innerText = 'Web (GitHub Pages)';
      }
    });

    async function ejecutarAuditoria() {
  const user = 'ax-col';
  const repo = 'ax';
  const subpath = 'zonadepruebas/test-repo-main';

  // Detección dinámica de la URL base
  let baseUrl;
  if (window.location.protocol === 'file:') {
    baseUrl = `https://${user}.github.io/${repo}/${subpath}`;
  } else {
    const currentPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
    baseUrl = `${window.location.origin}${currentPath}`;
  }

  const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${subpath}`;

  const startBtn = document.getElementById('startBtn');
  const statusBox = document.getElementById('statusBox');
  const statusText = document.getElementById('statusText');
  const progressBar = document.getElementById('progressBar');
  const scannedCount = document.getElementById('scannedCount');
  const previewContainer = document.getElementById('previewContainer');
  const previewBody = document.getElementById('previewBody');

  startBtn.disabled = true;
  startBtn.classList.add('opacity-50', 'cursor-not-allowed');
  statusBox.classList.remove('hidden');
  previewContainer.classList.add('hidden');
  previewBody.innerHTML = '';
  progressBar.style.width = '0%';
  statusText.innerText = "Consultando API de GitHub...";

  try {
    const response = await fetch(apiUrl);
    
    // Manejo de errores específicos según el estado HTTP devuelto por GitHub
    if (!response.ok) {
      if (response.status === 404) {
        throw new Error(`Ruta no encontrada (404). Revisa que la carpeta "${subpath}" exista en la rama principal del repositorio.`);
      } else if (response.status === 403) {
        throw new Error("Límite de API alcanzado (403). GitHub permite 60 consultas/hora por IP. Intenta en unos minutos.");
      } else {
        throw new Error(`Respuesta de API fallida (HTTP ${response.status}).`);
      }
    }
    
    const contents = await response.json();
    const folders = contents.filter(item => item.type === 'dir');

    if (folders.length === 0) {
      statusText.innerText = "No se encontraron subcarpetas en la ubicación especificada.";
      return;
    }

    statusText.innerText = `Se encontraron ${folders.length} subcarpetas. Midiendo respuesta...`;
    
    const resultados = [];
    let completados = 0;

    for (const folder of folders) {
      const pageUrl = `${baseUrl}/${folder.name}/`;
      const startTime = performance.now();

      try {
        await fetch(pageUrl, { method: 'HEAD', cache: 'no-cache' });
      } catch (e) {}

      const duration = Math.round(performance.now() - startTime);
      
      resultados.push({
        carpeta: folder.name,
        url: pageUrl,
        ms: duration
      });

      completados++;
      const porcentaje = (completados / folders.length) * 100;
      progressBar.style.width = `${porcentaje}%`;
      scannedCount.innerText = `${completados}/${folders.length}`;
      statusText.innerText = `Evaluando: /${folder.name}`;

      const row = document.createElement('tr');
      row.className = 'hover:bg-slate-800/50';
      row.innerHTML = `
        <td class="p-2.5 font-bold text-blue-400">${folder.name}</td>
        <td class="p-2.5 truncate max-w-[150px] sm:max-w-[220px] text-slate-400">${pageUrl}</td>
        <td class="p-2.5 text-right font-bold text-emerald-400">${duration} ms</td>
      `;
      previewBody.appendChild(row);
    }

    previewContainer.classList.remove('hidden');
    statusText.innerText = "Generando PDF y realizando descarga...";

    generarPDF(baseUrl, resultados);
    statusText.innerText = "¡Proceso finalizado! PDF descargado.";

  } catch (err) {
    statusText.innerText = `Error: ${err.message}`;
  } finally {
    startBtn.disabled = false;
    startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
  }
}


    function generarPDF(baseUrl, datos) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 32, 'F');

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(15);
      doc.setFont("helvetica", "bold");
      doc.text("Reporte de Subpáginas Web", 14, 16);

      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(148, 163, 184);
      doc.text(`Origen: ${baseUrl}/`, 14, 24);

      doc.setTextColor(30, 41, 59);
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text(`Total de subpáginas: ${datos.length}`, 14, 40);
      doc.setFont("helvetica", "normal");
      doc.text(`Fecha: ${new Date().toLocaleString()}`, 110, 40);

      const tableRows = datos.map((item, index) => [
        index + 1,
        item.carpeta,
        item.url,
        `${item.ms} ms`
      ]);

      doc.autoTable({
        startY: 46,
        head: [['#', 'Carpeta', 'Enlace Evaluado', 'Respuesta']],
        body: tableRows,
        theme: 'striped',
        headStyles: { 
          fillColor: [37, 99, 235], 
          textColor: [255, 255, 255], 
          fontStyle: 'bold',
          fontSize: 8 
        },
        styles: { fontSize: 8, cellPadding: 3 },
        columnStyles: {
          0: { cellWidth: 10 },
          1: { cellWidth: 35, fontStyle: 'bold' },
          2: { cellWidth: 110 },
          3: { cellWidth: 25, halign: 'right' }
        }
      });

      doc.save(`reporte_subpaginas_${Date.now()}.pdf`);
    }
  </script>
</body>
</html>
